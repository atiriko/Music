worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_static on;

    # Cache only content-hashed Vite assets indefinitely. Stable filenames such
    # as engine.zip, worker scripts, and SF2 banks revalidate after deployments.
    map $uri $cache_policy {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
        /healthz "no-store";
    }

    server {
        listen 43729;
        listen [::]:43729;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_policy;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # nginx's standard MIME table maps .js but not .mjs. Pyodide imports
        # native ES modules, which browsers reject as application/octet-stream.
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            try_files $uri =404;
        }

        # A missing runtime asset must be a real 404, never HTML pretending to
        # be JavaScript or WebAssembly.
        location ~* \.(?:js|mjs|css|wasm|whl|zip|sf2|json|ico|png|jpg|txt|md|map|gz)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
